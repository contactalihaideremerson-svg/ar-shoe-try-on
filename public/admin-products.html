<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Manager — AR Shoe Try-On</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #f5f5f7;
      --card: #fff;
      --text: #171717;
      --muted: #6b7280;
      --border: #e5e7eb;
      --black: #111;
      --green: #16a34a;
      --red: #dc2626;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .admin {
      width: min(100% - 28px, 1050px);
      margin: auto;
      padding: 42px 0 70px;
    }

    .header {
      margin-bottom: 24px;
    }

    .eyebrow {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 10px;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      line-height: 1.6;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
      margin-bottom: 22px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 750;
    }

    .section-count {
      color: var(--muted);
      font-size: 13px;
    }

    .products {
      display: grid;
      gap: 12px;
    }

    .product-row {
      display: grid;
      grid-template-columns: 70px minmax(0,1fr) auto;
      align-items: center;
      gap: 15px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: #fafafa;
    }

    .product-image {
      width: 70px;
      height: 70px;
      border-radius: 13px;
      object-fit: cover;
      background: #eee;
    }

    .product-name {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .product-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .product-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-label {
      min-width: 44px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-align: right;
    }

    .switch {
      position: relative;
      width: 52px;
      height: 30px;
      flex: 0 0 auto;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: #d1d5db;
      transition: .2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,.18);
      transition: .2s ease;
    }

    .switch input:checked + .slider {
      background: var(--green);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .add-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fafafa;
      padding: 13px 14px;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus, textarea:focus {
      background: #fff;
      border-color: #9ca3af;
      box-shadow: 0 0 0 4px rgba(17,17,17,.05);
    }

    .file-box {
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      background: #fafafa;
    }

    .file-box input {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .file-info {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      word-break: break-word;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      padding: 0 22px;
      background: var(--black);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 13px;
      font-size: 13px;
    }

    .status.show { display: block; }
    .status.loading { background: #eff6ff; color: #1d4ed8; }
    .status.success { background: #ecfdf5; color: #047857; }
    .status.error { background: #fef2f2; color: #b91c1c; }

    .empty {
      padding: 25px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 16px;
    }

    @media (max-width: 700px) {
      .admin { width: min(100% - 18px, 1050px); padding-top: 25px; }
      .card { padding: 17px; border-radius: 18px; }
      .add-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .product-row { grid-template-columns: 56px minmax(0,1fr) auto; gap: 10px; }
      .product-image { width: 56px; height: 56px; }
      .product-meta { font-size: 11px; }
      .status-label { display: none; }
      .actions button { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="admin">

    <header class="header">
      <span class="eyebrow">AR Shoe Try-On</span>
      <h1>Product Manager</h1>
      <p class="subtitle">
        Manage your AR shoe catalog. Turn products ON to show them in the
        customer try-on experience, or OFF to hide them without deleting them.
      </p>
    </header>

    <!-- EXISTING PRODUCTS -->
    <section class="card">
      <div class="section-head">
        <div class="section-title">Existing Products</div>
        <div id="product-count" class="section-count">Loading...</div>
      </div>

      <div id="products" class="products">
        <div class="empty">Loading products...</div>
      </div>

      <div id="list-status" class="status"></div>
    </section>

    <!-- ADD PRODUCT -->
    <section class="card">
      <div class="section-head">
        <div class="section-title">Add New Product</div>
      </div>

      <form id="product-form">
        <div class="add-grid">

          <div class="field">
            <label for="product-name">Product Name</label>
            <input
              id="product-name"
              type="text"
              placeholder="e.g. Traditional Embroidered Khussa"
              required
            />
          </div>

          <div class="field">
            <label for="product-price">Price</label>
            <input
              id="product-price"
              type="text"
              placeholder="e.g. Rs. 4,999"
              required
            />
          </div>

          <div class="field full">
            <label for="product-description">Description</label>
            <textarea
              id="product-description"
              placeholder="Describe the shoe..."
              required
            ></textarea>
          </div>

          <div class="field">
            <label for="product-image">Product Image</label>
            <div class="file-box">
              <input
                id="product-image"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                required
              />
              <div id="image-info" class="file-info">
                No image selected
              </div>
            </div>
          </div>

          <div class="field">
            <label for="product-effect">DeepAR Effect</label>
            <div class="file-box">
              <input
                id="product-effect"
                type="file"
                accept=".deepar,application/octet-stream"
                required
              />
              <div id="effect-info" class="file-info">
                No .deepar file selected
              </div>
            </div>
          </div>

        </div>

        <div id="status" class="status"></div>

        <div class="actions">
          <button id="submit-button" type="submit">
            Add Product
          </button>
        </div>
      </form>
    </section>

  </main>

  <script type="module">
    import {
      upload
    } from "https://esm.sh/@vercel/blob@2.6.1/client";

    const form = document.getElementById("product-form");
    const submitButton = document.getElementById("submit-button");
    const statusBox = document.getElementById("status");

    const productsBox = document.getElementById("products");
    const productCount = document.getElementById("product-count");
    const listStatus = document.getElementById("list-status");

    const imageInput = document.getElementById("product-image");
    const effectInput = document.getElementById("product-effect");
    const imageInfo = document.getElementById("image-info");
    const effectInfo = document.getElementById("effect-info");

    function showStatus(element, message, type) {
      element.textContent = message;
      element.className = `status show ${type}`;
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(1)} KB`;
      }
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      imageInfo.textContent = file
        ? `${file.name} (${formatFileSize(file.size)})`
        : "No image selected";
    });

    effectInput.addEventListener("change", () => {
      const file = effectInput.files[0];
      effectInfo.textContent = file
        ? `${file.name} (${formatFileSize(file.size)})`
        : "No .deepar file selected";
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
          const result = reader.result;

          if (typeof result !== "string") {
            reject(new Error("Could not read image."));
            return;
          }

          resolve(result.split(",")[1]);
        };

        reader.onerror = () => {
          reject(new Error(`Could not read ${file.name}`));
        };

        reader.readAsDataURL(file);
      });
    }

    async function uploadEffectToBlob(file) {
      showStatus(
        statusBox,
        "Uploading DeepAR effect...",
        "loading"
      );

      const blob = await upload(
        `effects/${Date.now()}-${file.name}`,
        file,
        {
          access: "private",
          handleUploadUrl: "/api/upload-effect",
          multipart: true,

          onUploadProgress(event) {
            const progress = Math.round(
              event.percentage || 0
            );

            showStatus(
              statusBox,
              `Uploading DeepAR effect... ${progress}%`,
              "loading"
            );
          }
        }
      );

      if (!blob || !blob.pathname) {
        throw new Error(
          "DeepAR upload completed but no Blob pathname was returned."
        );
      }

      return blob.pathname;
    }

    async function loadProducts() {
      try {
       
        const response = await fetch(
  `/api/products?t=${Date.now()}`,
  { cache: "no-store" }
);

        if (!response.ok) {
          throw new Error(
            `Could not load products: ${response.status}`
          );
        }

        const products = await response.json();

        if (!Array.isArray(products)) {
          throw new Error(
            "products.json must contain an array."
          );
        }

        productCount.textContent =
          `${products.length} product${products.length === 1 ? "" : "s"}`;

        if (!products.length) {
          productsBox.innerHTML =
            `<div class="empty">No products found.</div>`;
          return;
        }

        productsBox.innerHTML = "";

        products.forEach((product) => {
          const row = document.createElement("div");
          row.className = "product-row";

          const image = document.createElement("img");
          image.className = "product-image";
          image.src = product.image || "";
          image.alt = product.name || "Product";
          image.onerror = () => {
            image.style.visibility = "hidden";
          };

          const info = document.createElement("div");

          const name = document.createElement("div");
          name.className = "product-name";
          name.textContent = product.name || "Unnamed product";

          const meta = document.createElement("div");
          meta.className = "product-meta";
          meta.textContent =
            `${product.price || ""} • ${product.enabled === false ? "Hidden" : "Visible"}`;

          info.appendChild(name);
          info.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "product-actions";

          const label = document.createElement("span");
          label.className = "status-label";
          label.textContent =
            product.enabled === false ? "OFF" : "ON";

          const switchLabel = document.createElement("label");
          switchLabel.className = "switch";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked =
            product.enabled !== false;

          const slider = document.createElement("span");
          slider.className = "slider";

          checkbox.addEventListener("change", async () => {
            const newState = checkbox.checked;

            checkbox.disabled = true;

            label.textContent =
              newState ? "ON" : "OFF";

            meta.textContent =
              `${product.price || ""} • ${newState ? "Visible" : "Hidden"}`;

            showStatus(
              listStatus,
              `${product.name} is being ${newState ? "enabled" : "disabled"}...`,
              "loading"
            );

            try {
              const response = await fetch(
                "/api/update-product",
                {
                  
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    id: product.id,
                    enabled: newState
                  })
                }
                
              );

              

              const result = await response.json();

              if (!response.ok || !result.success) {
                throw new Error(
                  result.message ||
                  "Could not update product."
                );
              }

              product.enabled = newState;

              showStatus(
                listStatus,
                `${product.name} is now ${newState ? "ON and visible" : "OFF and hidden"}.`,
                "success"
              );

            } catch (error) {
              checkbox.checked = !newState;

              label.textContent =
                !newState ? "ON" : "OFF";

              meta.textContent =
                `${product.price || ""} • ${!newState ? "Visible" : "Hidden"}`;

              showStatus(
                listStatus,
                error.message ||
                  "Failed to update product.",
                "error"
              );
            } finally {
              checkbox.disabled = false;
            }
          });

          switchLabel.appendChild(checkbox);
          switchLabel.appendChild(slider);

          actions.appendChild(label);
          actions.appendChild(switchLabel);

          row.appendChild(image);
          row.appendChild(info);
          row.appendChild(actions);

          productsBox.appendChild(row);
        });

      } catch (error) {
        productsBox.innerHTML =
          `<div class="empty">${error.message}</div>`;

        productCount.textContent = "Unable to load";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name =
        document.getElementById("product-name")
          .value.trim();

      const price =
        document.getElementById("product-price")
          .value.trim();

      const description =
        document.getElementById("product-description")
          .value.trim();

      const imageFile =
        imageInput.files[0];

      const effectFile =
        effectInput.files[0];

      if (!name || !price || !description) {
        showStatus(
          statusBox,
          "Please fill in all product details.",
          "error"
        );
        return;
      }

      if (!imageFile) {
        showStatus(
          statusBox,
          "Please select a product image.",
          "error"
        );
        return;
      }

      if (!effectFile) {
        showStatus(
          statusBox,
          "Please select a .deepar effect file.",
          "error"
        );
        return;
      }

      if (
        !effectFile.name
          .toLowerCase()
          .endsWith(".deepar")
      ) {
        showStatus(
          statusBox,
          "The selected effect must be a .deepar file.",
          "error"
        );
        return;
      }

      if (
        imageFile.size >
        2.5 * 1024 * 1024
      ) {
        showStatus(
          statusBox,
          "Product image must be smaller than 2.5 MB.",
          "error"
        );
        return;
      }

      try {
        submitButton.disabled = true;
        submitButton.textContent = "Uploading...";

        showStatus(
          statusBox,
          "Preparing product image...",
          "loading"
        );

        const imageBase64 =
          await fileToBase64(imageFile);

        const effectBlobPathname =
          await uploadEffectToBlob(effectFile);

        showStatus(
          statusBox,
          "Adding product to GitHub...",
          "loading"
        );

        const response = await fetch(
          "/api/add-product",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              name,
              price,
              description,
              imageBase64,
              imageName: imageFile.name,
              effectBlobPathname,
              effectName: effectFile.name
            })
          }
        );

        const responseText =
          await response.text();

        let result;

        try {
          result = JSON.parse(responseText);
        } catch {
          throw new Error(
            responseText ||
            `Server returned HTTP ${response.status}`
          );
        }

        if (!response.ok || !result.success) {
          throw new Error(
            result.message ||
            "Product upload failed."
          );
        }

        showStatus(
          statusBox,
          `Product "${name}" added successfully and is ON by default.`,
          "success"
        );

        form.reset();

        imageInfo.textContent =
          "No image selected";

        effectInfo.textContent =
          "No .deepar file selected";

        await loadProducts();

      } catch (error) {
        console.error(
          "Product upload error:",
          error
        );

        showStatus(
          statusBox,
          error.message ||
            "Something went wrong while adding the product.",
          "error"
        );

      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Add Product";
      }
    });

    loadProducts();
  </script>
</body>
</html>
