<script type="module">
  import { upload } from "https://esm.sh/@vercel/blob@2.6.1/client";

  const form = document.getElementById("product-form");
  const submitButton = document.getElementById("submit-button");
  const statusBox = document.getElementById("status");

  const imageInput = document.getElementById("product-image");
  const effectInput = document.getElementById("product-effect");

  const imageInfo = document.getElementById("image-info");
  const effectInfo = document.getElementById("effect-info");

  imageInput.addEventListener("change", function () {
    const file = this.files[0];

    imageInfo.textContent = file
      ? `${file.name} (${formatFileSize(file.size)})`
      : "No image selected";
  });

  effectInput.addEventListener("change", function () {
    const file = this.files[0];

    effectInfo.textContent = file
      ? `${file.name} (${formatFileSize(file.size)})`
      : "No .deepar file selected";
  });

  function formatFileSize(bytes) {
    if (bytes < 1024) {
      return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
      return `${(bytes / 1024).toFixed(1)} KB`;
    }

    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = `status ${type}`;
  }

  /*
   * Convert product image to Base64.
   * The image is normally small enough for the API.
   */
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        resolve(reader.result.split(",")[1]);
      };

      reader.onerror = () => {
        reject(
          new Error(`Could not read ${file.name}`)
        );
      };

      reader.readAsDataURL(file);
    });
  }

  /*
   * Upload .deepar DIRECTLY to Vercel Blob.
   *
   * The 11.6 MB file therefore does NOT pass
   * through /api/add-product.
   */
  async function uploadEffectToBlob(file) {
    showStatus(
      "Uploading DeepAR effect...",
      "loading"
    );

    const blob = await upload(
      `effects/${Date.now()}-${file.name}`,
      file,
      {
        access: "private",

        handleUploadUrl:
          "/api/upload-effect",

        multipart: true,

        onUploadProgress(event) {
          const progress =
            Math.round(event.percentage);

          showStatus(
            `Uploading DeepAR effect... ${progress}%`,
            "loading"
          );
        }
      }
    );

    if (!blob || !blob.url) {
      throw new Error(
        "DeepAR upload completed but no Blob URL was returned."
      );
    }

    return blob.url;
  }

  /*
   * Submit product
   */
  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      const name = document
        .getElementById("product-name")
        .value
        .trim();

      const price = document
        .getElementById("product-price")
        .value
        .trim();

      const description = document
        .getElementById("product-description")
        .value
        .trim();

      const imageFile =
        imageInput.files[0];

      const effectFile =
        effectInput.files[0];

      /*
       * Validation
       */
      if (!name || !price || !description) {
        showStatus(
          "Please fill in all product details.",
          "error"
        );
        return;
      }

      if (!imageFile) {
        showStatus(
          "Please select a product image.",
          "error"
        );
        return;
      }

      if (!effectFile) {
        showStatus(
          "Please select a .deepar effect file.",
          "error"
        );
        return;
      }

      if (
        !effectFile.name
          .toLowerCase()
          .endsWith(".deepar")
      ) {
        showStatus(
          "The selected effect must be a .deepar file.",
          "error"
        );
        return;
      }

      try {

        submitButton.disabled = true;
        submitButton.textContent =
          "Uploading...";

        /*
         * Image → Base64
         */
        showStatus(
          "Preparing product image...",
          "loading"
        );

        const imageBase64 =
          await fileToBase64(imageFile);

        /*
         * DeepAR → Vercel Blob
         *
         * IMPORTANT:
         * The large .deepar file is NOT sent
         * to /api/add-product.
         */
        const effectBlobUrl =
          await uploadEffectToBlob(effectFile);

        /*
         * Send product information + Blob URL
         * to our GitHub API.
         */
        showStatus(
          "Adding product to GitHub...",
          "loading"
        );

        const response = await fetch(
          "/api/add-product",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              name,
              price,
              description,

              imageBase64,
              imageName:
                imageFile.name,

              effectBlobUrl,

              effectName:
                effectFile.name
            })
          }
        );

        /*
         * Don't blindly call response.json().
         * This prevents the old:
         *
         * Unexpected token 'R'
         *
         * error when Vercel returns plain text.
         */
        const responseText =
          await response.text();

        let result;

        try {
          result =
            JSON.parse(responseText);
        } catch {
          throw new Error(
            responseText ||
            `Server returned HTTP ${response.status}`
          );
        }

        if (
          !response.ok ||
          !result.success
        ) {
          throw new Error(
            result.message ||
            "Product upload failed."
          );
        }

        /*
         * Success
         */
        showStatus(
          `Product "${name}" added successfully. GitHub and Vercel will update automatically.`,
          "success"
        );

        form.reset();

        imageInfo.textContent =
          "No image selected";

        effectInfo.textContent =
          "No .deepar file selected";

      } catch (error) {

        console.error(
          "Product upload error:",
          error
        );

        showStatus(
          error.message ||
          "Something went wrong while adding the product.",
          "error"
        );

      } finally {

        submitButton.disabled = false;

        submitButton.textContent =
          "Add Product";
      }
    }
  );
</script>
