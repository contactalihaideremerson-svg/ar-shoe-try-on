<script>
  const form = document.getElementById("product-form");
  const submitButton = document.getElementById("submit-button");
  const statusBox = document.getElementById("status");

  const imageInput = document.getElementById("product-image");
  const effectInput = document.getElementById("product-effect");

  const imageInfo = document.getElementById("image-info");
  const effectInfo = document.getElementById("effect-info");

  imageInput.addEventListener("change", function () {
    const file = this.files[0];

    imageInfo.textContent = file
      ? `${file.name} (${formatFileSize(file.size)})`
      : "No image selected";
  });

  effectInput.addEventListener("change", function () {
    const file = this.files[0];

    effectInfo.textContent = file
      ? `${file.name} (${formatFileSize(file.size)})`
      : "No .deepar file selected";
  });

  function formatFileSize(bytes) {
    if (bytes < 1024) {
      return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
      return `${(bytes / 1024).toFixed(1)} KB`;
    }

    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function showStatus(message, type) {
    statusBox.textContent = message;
    statusBox.className = `status ${type}`;
  }

  /*
   * Convert image to Base64.
   * Images are normally small enough for the API.
   */
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        resolve(reader.result.split(",")[1]);
      };

      reader.onerror = () => {
        reject(new Error(`Could not read ${file.name}`));
      };

      reader.readAsDataURL(file);
    });
  }

  /*
   * Upload DeepAR file directly to Vercel Blob.
   */
  async function uploadEffectToBlob(file) {
    showStatus(
      "Uploading DeepAR effect to secure storage...",
      "loading"
    );

    /*
     * Ask our Vercel API for a client upload token.
     */
    const tokenResponse = await fetch(
      "/api/upload-effect",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          filename: file.name,
          contentType: "application/octet-stream"
        })
      }
    );

    const tokenData = await tokenResponse.json();

    if (!tokenResponse.ok || !tokenData.token) {
      throw new Error(
        tokenData.message ||
        "Could not prepare DeepAR upload."
      );
    }

    /*
     * Upload directly from browser to Blob.
     */
    const uploadResponse = await fetch(
      tokenData.uploadUrl,
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/octet-stream",
          "x-vercel-blob-token": tokenData.token
        },
        body: file
      }
    );

    if (!uploadResponse.ok) {
      const errorText = await uploadResponse.text();

      throw new Error(
        errorText ||
        "DeepAR upload failed."
      );
    }

    const blobResult =
      await uploadResponse.json();

    if (!blobResult.url) {
      throw new Error(
        "Blob upload completed but no URL was returned."
      );
    }

    return blobResult.url;
  }

  /*
   * Submit product.
   */
  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();

      const name = document
        .getElementById("product-name")
        .value
        .trim();

      const price = document
        .getElementById("product-price")
        .value
        .trim();

      const description = document
        .getElementById("product-description")
        .value
        .trim();

      const imageFile =
        imageInput.files[0];

      const effectFile =
        effectInput.files[0];

      if (!name || !price || !description) {
        showStatus(
          "Please fill in all product details.",
          "error"
        );
        return;
      }

      if (!imageFile) {
        showStatus(
          "Please select a product image.",
          "error"
        );
        return;
      }

      if (!effectFile) {
        showStatus(
          "Please select a .deepar effect file.",
          "error"
        );
        return;
      }

      if (
        !effectFile.name
          .toLowerCase()
          .endsWith(".deepar")
      ) {
        showStatus(
          "The selected effect must be a .deepar file.",
          "error"
        );
        return;
      }

      try {

        submitButton.disabled = true;
        submitButton.textContent = "Uploading...";

        /*
         * Image → Base64
         */
        showStatus(
          "Preparing product image...",
          "loading"
        );

        const imageBase64 =
          await fileToBase64(imageFile);

        /*
         * DeepAR → Blob
         */
        const effectBlobUrl =
          await uploadEffectToBlob(effectFile);

        /*
         * Send only the Blob URL + product data
         * to our GitHub API.
         */
        showStatus(
          "Adding product to GitHub...",
          "loading"
        );

        const response = await fetch(
          "/api/add-product",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              name,
              price,
              description,

              imageBase64,
              imageName: imageFile.name,

              effectBlobUrl,
              effectName: effectFile.name
            })
          }
        );

        const result =
          await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.message ||
            "Product upload failed."
          );
        }

        showStatus(
          `Product "${name}" added successfully. GitHub and Vercel will update automatically.`,
          "success"
        );

        form.reset();

        imageInfo.textContent =
          "No image selected";

        effectInfo.textContent =
          "No .deepar file selected";

      } catch (error) {

        console.error(error);

        showStatus(
          error.message ||
          "Something went wrong while adding the product.",
          "error"
        );

      } finally {

        submitButton.disabled = false;
        submitButton.textContent =
          "Add Product";
      }
    }
  );
</script>
