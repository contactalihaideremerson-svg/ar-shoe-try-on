<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>AR Shoe Try-On</title>

  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* =====================================================
   FULL SCREEN CAMERA
===================================================== */

#deepar-canvas {
  position: fixed;
  inset: 0;

  width: 100vw !important;
  height: 100vh !important;

  max-width: none !important;
  max-height: none !important;

  display: block;

  object-fit: cover;

  background: #050505;

  z-index: 1;
}

/* =====================================================
   CAMERA OVERLAY
===================================================== */

body::after {
  content: "";

  position: fixed;
  inset: 0;

  z-index: 2;

  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0.48) 0%,
      rgba(0, 0, 0, 0.05) 25%,
      rgba(0, 0, 0, 0.02) 55%,
      rgba(0, 0, 0, 0.72) 100%
    );
}

/* =====================================================
   TOP BAR
===================================================== */

#brand-text {
  position: fixed;

  top: 22px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 20;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 11px 20px;

  border-radius: 999px;

  background: rgba(15, 15, 15, 0.58);

  border: 1px solid rgba(255, 255, 255, 0.18);

  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);

  color: #fff;

  font-size: 13px;
  font-weight: 700;

  letter-spacing: 0.12em;

  box-shadow:
    0 10px 40px rgba(0, 0, 0, 0.25);
}

/* =====================================================
   LOADER
===================================================== */

#loader-wrapper {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 18px;

  background: #050505;
}

.loader {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  border: 3px solid rgba(255, 255, 255, 0.15);

  border-top-color: #fff;

  animation: spin 0.8s linear infinite;
}

.loader-text {
  color: rgba(255, 255, 255, 0.75);

  font-size: 14px;

  letter-spacing: 0.02em;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* =====================================================
   FEET INSTRUCTION
===================================================== */

#feet-text {
  position: fixed;

  top: 92px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 15;

  width: max-content;
  max-width: calc(100vw - 40px);

  padding: 10px 16px;

  border-radius: 999px;

  background: rgba(10, 10, 10, 0.48);

  border: 1px solid rgba(255, 255, 255, 0.16);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  color: #fff;

  font-size: 13px;

  text-align: center;
}

/* =====================================================
   SCAN AREA
===================================================== */

.scan-guide {
  position: fixed;

  inset: 0;

  z-index: 8;

  pointer-events: none;

  display: flex;

  align-items: center;
  justify-content: center;

  padding-bottom: 150px;
}

.scan-frame {
  position: relative;

  width: min(360px, 70vw);
  height: min(420px, 58vh);

  border: 1px solid rgba(255, 255, 255, 0.22);

  border-radius: 36px;

  opacity: 0.65;
}

.scan-frame::before,
.scan-frame::after {
  content: "";

  position: absolute;

  width: 42px;
  height: 42px;

  border-color: rgba(255, 255, 255, 0.9);

  border-style: solid;
}

.scan-frame::before {
  top: -1px;
  left: -1px;

  border-width: 2px 0 0 2px;

  border-radius: 35px 0 0 0;
}

.scan-frame::after {
  right: -1px;
  bottom: -1px;

  border-width: 0 2px 2px 0;

  border-radius: 0 0 35px 0;
}

/* =====================================================
   PRODUCT AREA
===================================================== */

.product-panel {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 30;

  padding:
    20px
    24px
    calc(20px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to top,
      rgba(0, 0, 0, 0.92),
      rgba(0, 0, 0, 0.72),
      rgba(0, 0, 0, 0)
    );

  pointer-events: auto;
}

.product-panel-header {
  width: min(1100px, 100%);

  margin: 0 auto 12px;

  display: flex;

  align-items: center;
  justify-content: space-between;
}

.product-panel-title {
  color: #fff;

  font-size: 15px;

  font-weight: 700;

  letter-spacing: -0.01em;
}

.product-count {
  color: rgba(255, 255, 255, 0.58);

  font-size: 12px;
}

/* =====================================================
   PRODUCT SCROLLER
===================================================== */

.product-scroll {
  width: 100%;

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: none;

  -webkit-overflow-scrolling: touch;
}

.product-scroll::-webkit-scrollbar {
  display: none;
}

.product-scroll .container-fluid {
  width: min(1100px, 100%);

  margin: auto;

  padding: 0;
}

/* =====================================================
   PRODUCT LIST
===================================================== */

#product-list {
  display: flex !important;

  flex-wrap: nowrap !important;

  gap: 12px;

  width: max-content;

  min-width: 100%;

  margin: 0;

  padding: 0 2px;
}

#product-list > .col {
  flex: 0 0 148px !important;

  width: 148px !important;

  max-width: 148px !important;

  padding: 0 !important;
}

/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card {
  width: 148px;

  min-height: 178px;

  overflow: hidden;

  display: flex;

  flex-direction: column;

  cursor: pointer;

  border-radius: 18px;

  background: rgba(255, 255, 255, 0.96);

  border: 2px solid transparent;

  color: #111;

  box-shadow:
    0 12px 35px rgba(0, 0, 0, 0.3);

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.product-card:hover {
  transform: translateY(-4px);

  box-shadow:
    0 18px 45px rgba(0, 0, 0, 0.4);
}

.product-card:active {
  transform: scale(0.96);
}

.product-card.selected {
  border-color: #fff;

  box-shadow:
    0 0 0 2px rgba(255, 255, 255, 0.3),
    0 15px 40px rgba(0, 0, 0, 0.4);
}

/* =====================================================
   PRODUCT IMAGE
===================================================== */

.img-span {
  position: relative;

  width: 100%;
  height: 112px;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: #f3f3f3;
}

.card-img-top {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  transition: transform 0.25s ease;
}

.product-card:hover .card-img-top {
  transform: scale(1.04);
}

/* =====================================================
   PRODUCT INFORMATION
===================================================== */

.product-card > div:last-child {
  flex: 1;

  padding: 9px 10px 10px !important;
}

.name-span {
  overflow: hidden;
}

.card-name {
  margin: 0;

  color: #111;

  font-size: 12px;

  font-weight: 750;

  line-height: 1.25;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.price {
  display: block;

  margin-top: 5px;

  color: #666;

  font-size: 11px;

  font-weight: 600;

  text-decoration: none;
}

/* =====================================================
   EMPTY PRODUCTS
===================================================== */

.products-message {
  padding: 15px 18px;

  border-radius: 16px;

  background: rgba(255, 255, 255, 0.08);

  border: 1px solid rgba(255, 255, 255, 0.12);

  color: rgba(255, 255, 255, 0.7);

  font-size: 13px;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  #brand-text {
    top: 14px;

    padding: 9px 16px;

    font-size: 11px;

    letter-spacing: 0.1em;
  }

  #feet-text {
    top: 66px;

    font-size: 11px;

    padding: 8px 13px;
  }

  .scan-guide {
    padding-bottom: 125px;
  }

  .scan-frame {
    width: 74vw;
    height: 48vh;

    border-radius: 28px;
  }

  .product-panel {
    padding:
      12px
      12px
      calc(12px + env(safe-area-inset-bottom));
  }

  .product-panel-header {
    margin-bottom: 8px;
  }

  .product-panel-title {
    font-size: 13px;
  }

  .product-count {
    font-size: 10px;
  }

  #product-list {
    gap: 8px;
  }

  #product-list > .col {
    flex-basis: 125px !important;

    width: 125px !important;

    max-width: 125px !important;
  }

  .product-card {
    width: 125px;

    min-height: 150px;

    border-radius: 15px;
  }

  .img-span {
    height: 92px;
  }

  .product-card > div:last-child {
    padding: 7px 8px 8px !important;
  }

  .card-name {
    font-size: 10.5px;
  }

  .price {
    margin-top: 3px;

    font-size: 9.5px;
  }
}

/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

  #product-list > .col {
    flex-basis: 112px !important;

    width: 112px !important;

    max-width: 112px !important;
  }

  .product-card {
    width: 112px;

    min-height: 138px;
  }

  .img-span {
    height: 82px;
  }

  .card-name {
    font-size: 10px;
  }
}

/* =====================================================
   LANDSCAPE MOBILE
===================================================== */

@media (
  orientation: landscape
) and (max-height: 600px) {

  .product-panel {
    padding-top: 8px;

    padding-bottom:
      calc(8px + env(safe-area-inset-bottom));
  }

  .product-panel-header {
    margin-bottom: 6px;
  }

  .product-card {
    min-height: 118px;
  }

  .img-span {
    height: 72px;
  }

  #product-list > .col {
    width: 105px !important;

    max-width: 105px !important;

    flex-basis: 105px !important;
  }

  .product-card {
    width: 105px;
  }

  .scan-guide {
    padding-bottom: 70px;
  }

  .scan-frame {
    width: 230px;
    height: 260px;
  }
}
</style>
</head>

<body>

  <!-- ==================================================
       DEEPAR CANVAS
  =================================================== -->

  <canvas id="deepar-canvas"></canvas>


  <!-- ==================================================
       LOADER
  =================================================== -->

  <div id="loader-wrapper">

    <div class="loader"></div>

    <div class="loader-text">
      Preparing virtual try-on...
    </div>

  </div>


  <!-- ==================================================
       BRAND
  =================================================== -->

  <div id="brand-text">
    AR SHOE TRY-ON
  </div>


  <!-- ==================================================
       FEET MESSAGE
  =================================================== -->

  <div id="feet-text">
    Place both feet inside the camera view.
  </div>


  <!-- ==================================================
       SCAN GUIDE
  =================================================== -->

  <div class="scan-guide">

    <div class="scan-frame"></div>

  </div>


  <!-- ==================================================
       PRODUCT PANEL
  =================================================== -->

  <section class="product-panel">

    <div class="product-panel-header">

      <div class="product-panel-title">
        Choose Your Shoe
      </div>

      <div
        class="product-count"
      >
        Loading products...
      </div>

    </div>


    <div class="product-scroll list-product album">

      <div class="container-fluid">

        <!--
          IMPORTANT:

          Products are automatically inserted here
          from:

          data/products.json

          Do not manually add Product Manager
          products to this section.
        -->

        <div
          class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3"
          id="product-list"
        >

          <!-- Dynamic products -->

        </div>

      </div>

    </div>

  </section>


  <!-- ==================================================
       MAIN BUNDLE
  =================================================== -->

  <script src="main.js"></script>

</body>
</html>
